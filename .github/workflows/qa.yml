name: Проверка сайта
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Общие блоки (отзывы, «¿Empezamos?») совпадают с source/bloki.py
        run: python3 source/bloki.py --check
      - name: FAQ на всех страницах совпадает с source/voprosy.py
        run: python3 source/voprosy.py --check
      - name: Playwright и Chromium
        run: |
          npm i --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Ссылки, метки, телефон, анимации появления
        run: node tests/qa.cjs --shots
      - name: Скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/shots/
          retention-days: 14
